<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratório Perdido — Plataforma de Desafios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b0a; --bg2:#0c1412; --panel:#0f1a17; --panel-edge:#1c2e29;
  --green:#3dffa0; --green-dim:#1f7a54; --amber:#ffb340; --cyan:#4fd8ff; --red:#ff4d5e;
  --text:#d8f3e6; --muted:#638577;
  --font-display:'Orbitron',sans-serif; --font-mono:'Share Tech Mono','Courier New',monospace;
}
*{box-sizing:border-box;}
body{margin:0; background:radial-gradient(ellipse at 50% -10%, #10231c 0%, var(--bg) 55%), var(--bg);
  color:var(--text); font-family:var(--font-mono); min-height:100vh;}
.wrap{max-width:1100px; margin:0 auto; padding:26px 18px 70px;}
h1,h2,h3{font-family:var(--font-display); margin:0 0 8px;}
h1{color:var(--green); font-size:clamp(22px,4vw,32px); text-shadow:0 0 10px rgba(61,255,160,.35);}
h2{color:var(--text); font-size:18px;}
h3{color:var(--green); font-size:15px;}
p{line-height:1.55; color:var(--text);}
.muted{color:var(--muted); font-size:12.5px;}
a{color:var(--cyan);}
.hidden{display:none !important;}

.topbar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:20px;}
.tag{font-size:11px; letter-spacing:3px; color:var(--amber);}
.pill{border:1px solid var(--panel-edge); background:rgba(0,0,0,.35); border-radius:4px; padding:6px 12px; font-size:12px;}

.card{background:var(--panel); border:1px solid var(--panel-edge); border-radius:6px; padding:18px; margin-bottom:14px;}
.card.clickable{cursor:pointer; transition:transform .12s ease, border-color .12s ease;}
.card.clickable:hover{transform:translateY(-2px); border-color:var(--green-dim);}
.card.locked{opacity:.5;}
.card.done{border-color:var(--green); box-shadow:0 0 14px rgba(61,255,160,.12);}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:640px){.grid2{grid-template-columns:1fr;}}

label{display:block; font-size:11.5px; color:var(--muted); margin:10px 0 4px; letter-spacing:.5px;}
input[type=text], input[type=number], textarea, select{
  width:100%; background:#050908; color:var(--text); border:1px solid var(--panel-edge);
  border-radius:4px; padding:9px 11px; font-family:var(--font-mono); font-size:13px; outline:none;
}
input:focus, textarea:focus, select:focus{border-color:var(--green-dim);}
textarea{min-height:80px; resize:vertical;}
.btn{font-family:var(--font-mono); background:var(--green); color:#03150d; border:none; padding:9px 16px;
  border-radius:4px; cursor:pointer; font-weight:bold; font-size:12.5px; letter-spacing:.5px;}
.btn:hover{filter:brightness(1.08);}
.btn.amber{background:var(--amber);}
.btn.red{background:var(--red); color:#1a0505;}
.btn.ghost{background:transparent; border:1px solid var(--panel-edge); color:var(--muted);}
.btn.ghost:hover{border-color:var(--green-dim); color:var(--green);}
.btn.small{padding:6px 10px; font-size:11px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px;}

.badge{display:inline-block; font-size:10.5px; padding:3px 8px; border-radius:20px; border:1px solid var(--panel-edge); color:var(--muted);}
.badge.ok{color:var(--green); border-color:var(--green);}
.badge.wait{color:var(--amber); border-color:var(--amber);}

.feedback{font-size:12.5px; margin-top:8px;}
.feedback.ok{color:var(--green);} .feedback.err{color:var(--red);}

.caso-box{border:1px dashed var(--panel-edge); border-radius:5px; padding:12px; margin-top:10px;}
.hint-box{margin-top:10px; font-size:12.5px; color:var(--amber); border:1px dashed var(--amber);
  border-radius:4px; padding:9px 11px; white-space:pre-wrap; display:none;}
.hint-box.show{display:block;}

.divider{border:none; border-top:1px solid var(--panel-edge); margin:16px 0;}

#printReport{display:none;}
@media print{
  body *{visibility:hidden;}
  #printReport, #printReport *{visibility:visible;}
  #printReport{display:block; position:absolute; top:0; left:0; width:100%; color:#000; background:#fff; padding:40px; font-family:Arial, sans-serif;}
  #printReport table{width:100%; border-collapse:collapse; font-size:14px;}
  #printReport td{padding:8px; border-bottom:1px solid #ddd;}
}
.toast{position:fixed; bottom:16px; right:16px; background:var(--panel); border:1px solid var(--green); color:var(--green);
  padding:10px 16px; border-radius:5px; font-size:12.5px; z-index:999; opacity:0; transition:opacity .3s;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="printReport">
  <h1>Laboratório Perdido — Relatório da Missão</h1>
  <table>
    <tr><td>Equipe</td><td id="prTeam"></td></tr>
    <tr><td>Data</td><td id="prDate"></td></tr>
    <tr><td>Tempo total</td><td id="prTime"></td></tr>
    <tr><td>Dicas usadas</td><td id="prHints"></td></tr>
    <tr><td>Tentativas erradas</td><td id="prErrors"></td></tr>
    <tr><td>Pontuação final</td><td id="prScore"></td></tr>
  </table>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== ARMAZENAMENTO ===================== */
const DB_KEY = 'labPerdido_conteudo_v1';
const PROGRESS_PREFIX = 'labPerdido_progresso_';

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if (raw) return JSON.parse(raw);
  }catch(e){}
  return { modulos: [], questoes: [] };
}
function saveDB(db){
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}
function loadProgress(equipe){
  try{
    const raw = localStorage.getItem(PROGRESS_PREFIX + equipe);
    if (raw) return JSON.parse(raw);
  }catch(e){}
  return { equipe, inicio: Date.now(), pontuacao:100, dicasUsadas:0, erros:0, respostas:{} };
}
function saveProgress(p){
  localStorage.setItem(PROGRESS_PREFIX + p.equipe, JSON.stringify(p));
}

/* Tenta carregar config.json + o conteúdo ativo apontado por ele.
   Se não conseguir (ex: rodando como arquivo local sem servidor), mantém o que já
   estiver salvo no localStorage deste navegador (comportamento antigo, como fallback). */
async function carregarConteudoRemoto(){
  try{
    const cfgResp = await fetch('config.json', { cache: 'no-store' });
    if (!cfgResp.ok) return false;
    const cfg = await cfgResp.json();
    if (!cfg.ativo) return false;

    const contResp = await fetch(cfg.ativo, { cache: 'no-store' });
    if (!contResp.ok) return false;
    const conteudo = await contResp.json();
    if (!conteudo.modulos || !conteudo.questoes) return false;

    DB = conteudo;
    saveDB(DB); // guarda uma cópia local, serve de cache se ficar offline depois
    FONTE_CONTEUDO = { origem: 'remoto', arquivo: cfg.ativo };
    return true;
  }catch(e){
    return false; // ex: aberto como arquivo local (file://), sem servidor -> ignora e usa o localStorage
  }
}

let DB = loadDB();
let FONTE_CONTEUDO = { origem: 'local', arquivo: null }; // preenchido pelo carregamento remoto, se houver
const SENHA_PROFESSOR = 'semsenha';
function acessarProfessor(){
  const senha = prompt('Senha do painel do professor:');
  if (senha === null) return;
  if (senha.trim().toLowerCase() !== SENHA_PROFESSOR){ toast('Senha incorreta.'); return; }
  ir('professor');
}
let PROGRESS = null; // carregado quando o aluno informa o nome da equipe

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ===================== ROTEAMENTO SIMPLES ===================== */
let VIEW = 'inicio'; // inicio | professor | professor_modulo | aluno | aluno_modulo | aluno_questao | sucesso
let CTX = {}; // contexto da view atual (ids selecionados)

function render(){
  const app = document.getElementById('app');
  if (VIEW === 'inicio') app.innerHTML = viewInicio();
  else if (VIEW === 'professor') app.innerHTML = viewProfessor();
  else if (VIEW === 'professor_questoes') app.innerHTML = viewProfessorQuestoes();
  else if (VIEW === 'professor_form_questao') app.innerHTML = viewFormQuestao();
  else if (VIEW === 'aluno_login') app.innerHTML = viewAlunoLogin();
  else if (VIEW === 'aluno') app.innerHTML = viewAluno();
  else if (VIEW === 'aluno_modulo') app.innerHTML = viewAlunoModulo();
  else if (VIEW === 'sucesso') app.innerHTML = viewSucesso();
  afterRender();
}

function ir(view, ctx={}){ VIEW = view; CTX = ctx; render(); window.scrollTo(0,0); }

/* ===================== TELA INICIAL ===================== */
function viewInicio(){
  return `
    <div class="topbar"><div><span class="tag">Sistema de Segurança // Laboratório de Programação</span><h1>LABORATÓRIO PERDIDO</h1></div></div>
    ${badgeConteudoAtivo()}
    <div class="card">
      <p>Escolha como deseja entrar na plataforma.</p>
      <div class="row">
        <button class="btn" onclick="acessarProfessor()">🧑‍🏫 Sou professor(a)</button>
        <button class="btn amber" onclick="ir('aluno_login')">🎓 Sou aluno / equipe</button>
      </div>
    </div>
  `;
}
function badgeConteudoAtivo(){
  const nome = (DB.meta && DB.meta.nome) ? DB.meta.nome : (DB.modulos.length ? '(sem nome definido)' : 'nenhum conteúdo carregado');
  const origemTxt = FONTE_CONTEUDO.origem === 'remoto'
    ? `carregado de <b>${escapeHtml(FONTE_CONTEUDO.arquivo)}</b> via config.json`
    : 'carregado do armazenamento deste navegador (local)';
  return `<div class="row" style="margin-bottom:14px;"><span class="pill">📦 Conteúdo ativo: <b>${escapeHtml(nome)}</b> — ${origemTxt}</span></div>`;
}

/* ===================== PAINEL DO PROFESSOR ===================== */
function viewProfessor(){
  const modulosHtml = DB.modulos.length ? DB.modulos
    .sort((a,b)=>a.ordem-b.ordem)
    .map(m => {
      const qtd = DB.questoes.filter(q=>q.moduloId===m.id).length;
      return `
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <div>
            <h3>#${m.ordem} — ${escapeHtml(m.nome)}</h3>
            <p class="muted">${escapeHtml(m.descricao||'')}</p>
            <span class="badge">${qtd} questão(ões) cadastradas</span>
            <span class="badge">necessário: ${m.obrigatorias} para concluir</span>
          </div>
          <div class="row">
            <button class="btn small" onclick="ir('professor_questoes',{moduloId:'${m.id}'})">Gerenciar questões</button>
            <button class="btn small ghost" onclick="editarModulo('${m.id}')">Editar</button>
            <button class="btn small red" onclick="excluirModulo('${m.id}')">Excluir</button>
          </div>
        </div>
      </div>`;
    }).join('')
    : `<p class="muted">Nenhum módulo criado ainda.</p>`;

  return `
    <div class="topbar">
      <div><span class="tag">Painel do Professor</span><h1>Meus Módulos</h1></div>
      <button class="btn ghost" onclick="ir('inicio')">⟵ Voltar</button>
    </div>
    ${badgeConteudoAtivo()}

    <div class="card">
      <label>Nome deste conjunto de conteúdo (aparece para você e para os alunos, e vai junto no arquivo exportado)</label>
      <input id="nomeConjunto" type="text" value="${escapeHtml((DB.meta&&DB.meta.nome)||'')}" placeholder="Ex: Turma 201 — Conteúdo 2 (Vetores)" onchange="DB.meta = DB.meta||{}; DB.meta.nome = this.value; saveDB(DB);">
    </div>

    <div class="card">
      <h2>+ Novo módulo</h2>
      <div class="grid2">
        <div><label>Nome do módulo</label><input id="novoModNome" type="text" placeholder="Ex: Variáveis e Tipos"></div>
        <div><label>Questões necessárias para concluir</label><input id="novoModObrig" type="number" min="1" value="1"></div>
      </div>
      <label>Descrição (opcional)</label>
      <textarea id="novoModDesc" placeholder="Breve contexto do módulo, exibido para o aluno"></textarea>
      <div class="row"><button class="btn" onclick="criarModulo()">Adicionar módulo</button></div>
    </div>

    <hr class="divider">
    ${modulosHtml}

    <hr class="divider">
    <div class="card">
      <h2>Conteúdo &amp; Progresso</h2>
      <p class="muted">Exporte o conteúdo criado aqui para levar para outros computadores, ou importe um arquivo já pronto.</p>
      <div class="row">
        <button class="btn ghost" onclick="exportarConteudo()">⬇ Exportar conteúdo (.json)</button>
        <label class="btn ghost" style="cursor:pointer;">⬆ Importar conteúdo (.json)
          <input type="file" accept=".json" style="display:none;" onchange="importarConteudo(event)">
        </label>
        <button class="btn ghost" onclick="verEquipes()">🏆 Ver progresso das equipes</button>
        <button class="btn red" onclick="if(confirm('Isso apaga TODOS os módulos e questões. Confirmar?')) { DB={modulos:[],questoes:[]}; saveDB(DB); render(); }">Apagar tudo</button>
      </div>
    </div>
  `;
}

function criarModulo(){
  const nome = document.getElementById('novoModNome').value.trim();
  const obrig = parseInt(document.getElementById('novoModObrig').value) || 1;
  const desc = document.getElementById('novoModDesc').value.trim();
  if (!nome){ toast('Digite um nome para o módulo.'); return; }
  const ordem = DB.modulos.length ? Math.max(...DB.modulos.map(m=>m.ordem)) + 1 : 1;
  DB.modulos.push({ id: uid(), ordem, nome, descricao: desc, obrigatorias: obrig });
  saveDB(DB);
  render();
}
function editarModulo(id){
  const m = DB.modulos.find(x=>x.id===id);
  const nome = prompt('Nome do módulo:', m.nome);
  if (nome === null) return;
  const obrig = prompt('Questões necessárias para concluir:', m.obrigatorias);
  if (obrig === null) return;
  const desc = prompt('Descrição:', m.descricao||'');
  m.nome = nome.trim() || m.nome;
  m.obrigatorias = parseInt(obrig) || m.obrigatorias;
  m.descricao = desc;
  saveDB(DB);
  render();
}
function excluirModulo(id){
  if (!confirm('Excluir este módulo e todas as suas questões?')) return;
  DB.modulos = DB.modulos.filter(m=>m.id!==id);
  DB.questoes = DB.questoes.filter(q=>q.moduloId!==id);
  saveDB(DB);
  render();
}

function exportarConteudo(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lab_perdido_conteudo.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importarConteudo(ev){
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const novo = JSON.parse(reader.result);
      if (!novo.modulos || !novo.questoes) throw new Error('formato inválido');
      DB = novo; saveDB(DB); toast('Conteúdo importado!'); render();
    }catch(e){ alert('Arquivo inválido: ' + e.message); }
  };
  reader.readAsText(file);
}

function verEquipes(){
  const nomes = Object.keys(localStorage).filter(k=>k.startsWith(PROGRESS_PREFIX)).map(k=>k.slice(PROGRESS_PREFIX.length));
  if (!nomes.length){ alert('Nenhuma equipe jogou neste computador ainda.'); return; }
  const linhas = nomes.map(n => {
    const p = loadProgress(n);
    const acertos = Object.values(p.respostas).filter(r=>r.ok).length;
    return `${n}: ${acertos} questões corretas — pontuação ${p.pontuacao}`;
  });
  alert('Progresso registrado neste computador:\n\n' + linhas.join('\n'));
}

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===================== PROFESSOR: QUESTÕES DE UM MÓDULO ===================== */
function viewProfessorQuestoes(){
  const mod = DB.modulos.find(m=>m.id===CTX.moduloId);
  const questoes = DB.questoes.filter(q=>q.moduloId===mod.id);
  const lista = questoes.length ? questoes.map((q,i) => `
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div><h3>${i+1}. ${escapeHtml(q.titulo)}</h3><p class="muted">${q.casos.length} caso(s) de teste</p></div>
        <div class="row">
          <button class="btn small ghost" onclick="ir('professor_form_questao',{moduloId:'${mod.id}', questaoId:'${q.id}'})">Editar</button>
          <button class="btn small red" onclick="excluirQuestao('${q.id}')">Excluir</button>
        </div>
      </div>
    </div>`).join('') : '<p class="muted">Nenhuma questão cadastrada ainda.</p>';

  return `
    <div class="topbar">
      <div><span class="tag">Módulo</span><h1>${escapeHtml(mod.nome)}</h1></div>
      <button class="btn ghost" onclick="ir('professor')">⟵ Voltar aos módulos</button>
    </div>
    <div class="row"><button class="btn" onclick="ir('professor_form_questao',{moduloId:'${mod.id}'})">+ Nova questão</button></div>
    <hr class="divider">
    ${lista}
  `;
}
function excluirQuestao(id){
  if (!confirm('Excluir esta questão?')) return;
  DB.questoes = DB.questoes.filter(q=>q.id!==id);
  saveDB(DB);
  render();
}

/* ===================== PROFESSOR: FORM DE QUESTÃO ===================== */
let CASOS_TEMP = [];
function viewFormQuestao(){
  const editando = !!CTX.questaoId;
  const q = editando ? DB.questoes.find(x=>x.id===CTX.questaoId) : null;
  CASOS_TEMP = q ? JSON.parse(JSON.stringify(q.casos)) : [{ entrada:'', saidaEsperada:'', modo:'contem' }];

  return `
    <div class="topbar">
      <div><span class="tag">${editando ? 'Editar questão' : 'Nova questão'}</span><h1>Conteúdo da Questão</h1></div>
      <button class="btn ghost" onclick="ir('professor_questoes',{moduloId:'${CTX.moduloId}'})">⟵ Voltar</button>
    </div>

    <div class="card">
      <label>Título da questão</label>
      <input id="qTitulo" type="text" value="${q ? escapeHtml(q.titulo) : ''}" placeholder="Ex: Computador 1 — Variáveis">

      <label>Enunciado / problema (o que o aluno precisa fazer)</label>
      <textarea id="qEnunciado" placeholder="Descreva o problema, sem entregar a sintaxe pronta.">${q ? escapeHtml(q.enunciado) : ''}</textarea>

      <div class="grid2">
        <div><label>Pontos desta questão</label><input id="qPontos" type="number" min="1" value="${q ? q.pontosBase : 10}"></div>
      </div>

      <label>Dicas (opcionais, 1ª grátis / 2ª e 3ª custam pontos)</label>
      <input id="qDica1" type="text" value="${q ? escapeHtml(q.dica1||'') : ''}" placeholder="Dica 1 — conceitual">
      <input id="qDica2" type="text" value="${q ? escapeHtml(q.dica2||'') : ''}" placeholder="Dica 2 — mais específica" style="margin-top:6px;">
      <input id="qDica3" type="text" value="${q ? escapeHtml(q.dica3||'') : ''}" placeholder="Dica 3 — quase a resposta" style="margin-top:6px;">

      <hr class="divider">
      <h3>Casos de teste (saídas esperadas)</h3>
      <p class="muted">Cada caso descreve um cenário (ex: "idade = 15") e a saída que o programa do aluno deveria imprimir para esse cenário. O aluno roda o código dele mesmo e cola a saída aqui.</p>
      <div id="casosContainer"></div>
      <div class="row"><button class="btn ghost small" onclick="addCaso()">+ adicionar caso de teste</button></div>

      <hr class="divider">
      <div class="row">
        <button class="btn" onclick="salvarQuestao()">${editando ? 'Salvar alterações' : 'Criar questão'}</button>
      </div>
    </div>
  `;
}
function renderCasos(){
  const c = document.getElementById('casosContainer');
  if (!c) return;
  c.innerHTML = CASOS_TEMP.map((caso,i) => `
    <div class="caso-box">
      <div class="row" style="justify-content:space-between;"><b class="muted">Caso ${i+1}</b>
        <button class="btn small red" onclick="removerCaso(${i})">remover</button></div>
      <label>Cenário / entrada (mostrado ao aluno, opcional)</label>
      <input type="text" value="${escapeHtml(caso.entrada)}" oninput="CASOS_TEMP[${i}].entrada=this.value" placeholder="Ex: idade = 15">
      <label>Saída esperada</label>
      <textarea oninput="CASOS_TEMP[${i}].saidaEsperada=this.value" placeholder="Ex: Acesso negado">${escapeHtml(caso.saidaEsperada)}</textarea>
      <label>Modo de comparação</label>
      <select onchange="CASOS_TEMP[${i}].modo=this.value">
        <option value="exata" ${caso.modo==='exata'?'selected':''}>Saída exata (ignora maiúsc./espaços nas pontas)</option>
        <option value="contem" ${caso.modo==='contem'?'selected':''}>Saída contém este texto</option>
        <option value="regex" ${caso.modo==='regex'?'selected':''}>Expressão regular (avançado)</option>
      </select>
    </div>
  `).join('');
}
function addCaso(){ CASOS_TEMP.push({entrada:'', saidaEsperada:'', modo:'contem'}); renderCasos(); }
function removerCaso(i){ CASOS_TEMP.splice(i,1); renderCasos(); }

function salvarQuestao(){
  const titulo = document.getElementById('qTitulo').value.trim();
  const enunciado = document.getElementById('qEnunciado').value.trim();
  const pontos = parseInt(document.getElementById('qPontos').value) || 10;
  const dica1 = document.getElementById('qDica1').value.trim();
  const dica2 = document.getElementById('qDica2').value.trim();
  const dica3 = document.getElementById('qDica3').value.trim();
  if (!titulo || !enunciado){ toast('Preencha título e enunciado.'); return; }
  const casosValidos = CASOS_TEMP.filter(c=>c.saidaEsperada.trim().length>0);
  if (!casosValidos.length){ toast('Adicione ao menos um caso de teste com saída esperada.'); return; }

  if (CTX.questaoId){
    const q = DB.questoes.find(x=>x.id===CTX.questaoId);
    Object.assign(q, { titulo, enunciado, pontosBase:pontos, dica1, dica2, dica3, casos:casosValidos });
  } else {
    DB.questoes.push({ id: uid(), moduloId: CTX.moduloId, titulo, enunciado, pontosBase:pontos, dica1, dica2, dica3, casos:casosValidos });
  }
  saveDB(DB);
  toast('Questão salva!');
  ir('professor_questoes',{moduloId:CTX.moduloId});
}

    <div class="topbar"><div><span class="tag">Modo Aluno</span><h1>Identifique sua equipe</h1></div>
      <button class="btn ghost" onclick="ir('inicio')">⟵ Voltar</button></div>
    <div class="card">
      <label>Nome da equipe</label>
      <input id="loginEquipe" type="text" placeholder="Ex: Equipe Byte">

      <p class="muted" style="margin-top:10px;">Seu progresso fica salvo neste computador com esse nome — use sempre o mesmo nome pra continuar de onde parou.</p>

  `;

function entrarComoAluno(){

  if (!nome){ toast('Digite o nome da equipe.'); return; }
  PROGRESS = loadProgress(nome);
  saveProgress(PROGRESS);
  ir('aluno');
}

/* ===================== ALUNO: LISTA DE MÓDULOS ===================== */
function moduloStatus(mod){
  const questoes = DB.questoes.filter(q=>q.moduloId===mod.id);
  const acertos = questoes.filter(q => PROGRESS.respostas[q.id] && PROGRESS.respostas[q.id].ok).length;
  const completo = acertos >= mod.obrigatorias && questoes.length>0;
  return { questoes, acertos, completo };
}
function moduloDesbloqueado(mod, modulosOrdenados){
  const idx = modulosOrdenados.findIndex(m=>m.id===mod.id);
  if (idx === 0) return true;
  const anterior = modulosOrdenados[idx-1];
  return moduloStatus(anterior).completo;
}

function statsHeader(){
  const tempo = Math.floor((Date.now() - PROGRESS.inicio)/1000);
  const m = String(Math.floor(tempo/60)).padStart(2,'0'), s = String(tempo%60).padStart(2,'0');
  return `
    <div class="row" style="margin-bottom:14px;">
      <span class="pill">👥 ${escapeHtml(PROGRESS.equipe)}</span>
      <span class="pill">⏱ ${m}:${s}</span>
      <span class="pill">★ ${PROGRESS.pontuacao} pts</span>
      <span class="pill">💡 ${PROGRESS.dicasUsadas} dicas usadas</span>
      <span class="pill">❌ ${PROGRESS.erros} erros</span>
    </div>`;
}

function viewAluno(){
  const mods = [...DB.modulos].sort((a,b)=>a.ordem-b.ordem);
  if (!mods.length){
    return `<div class="topbar"><h1>Nenhum desafio disponível</h1></div><p class="muted">O professor ainda não cadastrou módulos. Se ele te enviou um arquivo .json de conteúdo, peça pra importar aqui pelo painel de professor deste computador.</p>`;
  }
  const todosCompletos = mods.every(m => moduloStatus(m).completo);
  if (todosCompletos) { ir('sucesso'); return ''; }

  const cards = mods.map(mod => {
    const st = moduloStatus(mod);
    const unlocked = moduloDesbloqueado(mod, mods);
    const classe = !unlocked ? 'locked' : (st.completo ? 'done' : 'clickable');
    const clique = unlocked ? `onclick="ir('aluno_modulo',{moduloId:'${mod.id}'})"` : '';
    return `
      <div class="card ${classe}" ${clique}>
        <div class="row" style="justify-content:space-between;">
          <div>
            <h3>#${mod.ordem} — ${escapeHtml(mod.nome)}</h3>
            <p class="muted">${escapeHtml(mod.descricao||'')}</p>
          </div>
          <div>
            ${!unlocked ? '<span class="badge">🔒 bloqueado</span>' :
              st.completo ? '<span class="badge ok">✔ concluído</span>' :
              `<span class="badge wait">${st.acertos}/${mod.obrigatorias} necessárias</span>`}
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="topbar">
      <div><span class="tag">Modo Aluno</span><h1>Módulos</h1></div>
      <button class="btn ghost" onclick="ir('inicio')">⟵ Sair</button>
    </div>
    ${badgeConteudoAtivo()}
    ${statsHeader()}
    ${cards}
  `;
}

/* ===================== ALUNO: MÓDULO / QUESTÕES ===================== */
function viewAlunoModulo(){
  const mod = DB.modulos.find(m=>m.id===CTX.moduloId);
  const questoes = DB.questoes.filter(q=>q.moduloId===mod.id);
  const lista = questoes.map((q,i) => {
    const resp = PROGRESS.respostas[q.id];
    const ok = resp && resp.ok;
    return `
      <div class="card ${ok?'done':'clickable'}" ${ok?'':`onclick="abrirQuestao('${q.id}')"`}>
        <div class="row" style="justify-content:space-between;">
          <h3>${i+1}. ${escapeHtml(q.titulo)}</h3>
          ${ok ? '<span class="badge ok">✔ resolvida</span>' : '<span class="badge">pendente</span>'}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="topbar">
      <div><span class="tag">Módulo #${mod.ordem}</span><h1>${escapeHtml(mod.nome)}</h1></div>
      <button class="btn ghost" onclick="ir('aluno')">⟵ Voltar aos módulos</button>
    </div>
    ${statsHeader()}
    <p>${escapeHtml(mod.descricao||'')}</p>
    <hr class="divider">
    ${lista}
    <div id="questaoDetalhe"></div>
  `;
}

function abrirQuestao(qId){
  const q = DB.questoes.find(x=>x.id===qId);
  const det = document.getElementById('questaoDetalhe');
  det.innerHTML = `
    <div class="card" id="painelQuestao">
      <h2>${escapeHtml(q.titulo)}</h2>
      <p>${escapeHtml(q.enunciado)}</p>
      <div id="casosAluno"></div>
      <div class="row">
        <button class="btn" onclick="verificarQuestao('${q.id}')">VERIFICAR</button>
        <button class="btn ghost" onclick="pedirDica('${q.id}')">💡 PEDIR DICA</button>
      </div>
      <div class="feedback" id="fbQuestao"></div>
      <div class="hint-box" id="hintQuestao"></div>
    </div>
  `;
  const casosDiv = document.getElementById('casosAluno');
  casosDiv.innerHTML = q.casos.map((c,i) => `
    <div class="caso-box">
      ${c.entrada ? `<p class="muted">Cenário: <b>${escapeHtml(c.entrada)}</b></p>` : ''}
      <label>Cole aqui a saída que o seu programa mostrou no console:</label>
      <textarea id="saidaCaso_${i}" placeholder="cole a saída do console aqui..."></textarea>
    </div>
  `).join('');
  det.scrollIntoView({behavior:'smooth'});
}

function compararSaida(saidaAluno, caso){
  const a = (saidaAluno||'').trim();
  const esperado = caso.saidaEsperada.trim();
  if (caso.modo === 'exata'){
    return a.toLowerCase().replace(/\s+/g,' ') === esperado.toLowerCase().replace(/\s+/g,' ');
  }
  if (caso.modo === 'regex'){
    try{ return new RegExp(esperado, 'i').test(a); }catch(e){ return false; }
  }
  // contém (padrão)
  return a.toLowerCase().includes(esperado.toLowerCase());
}

function verificarQuestao(qId){
  const q = DB.questoes.find(x=>x.id===qId);
  let todasOk = true;
  const erros = [];
  q.casos.forEach((c,i) => {
    const val = document.getElementById('saidaCaso_'+i).value;
    const ok = val.trim().length>0 && compararSaida(val, c);
    if (!ok){ todasOk = false; erros.push(`Caso ${i+1}${c.entrada?` (${c.entrada})`:''}: saída não confere com o esperado.`); }
  });
  const fb = document.getElementById('fbQuestao');
  if (todasOk){
    PROGRESS.respostas[qId] = { ok:true, tentativas: (PROGRESS.respostas[qId]?.tentativas||0) + 1 };
    saveProgress(PROGRESS);
    fb.innerHTML = '✔ Questão validada com sucesso!';
    fb.className = 'feedback ok';
    setTimeout(()=> ir('aluno_modulo',{moduloId:CTX.moduloId}), 700);
  } else {
    PROGRESS.erros++;
    saveProgress(PROGRESS);
    fb.innerHTML = 'Ainda não é isso:<br>• ' + erros.join('<br>• ');
    fb.className = 'feedback err';
  }
}

function pedirDica(qId){
  const q = DB.questoes.find(x=>x.id===qId);
  const dicas = [q.dica1, q.dica2, q.dica3].filter(Boolean);
  if (!dicas.length){ toast('Não há dicas cadastradas para esta questão.'); return; }
  const usadas = PROGRESS._dicaAtual = (PROGRESS._dicaAtual||{});
  const nivel = usadas[qId] || 0;
  if (nivel >= dicas.length){ toast('Sem mais dicas para esta questão.'); return; }
  const custo = nivel === 0 ? 0 : nivel === 1 ? 2 : 5;
  PROGRESS.pontuacao = Math.max(0, PROGRESS.pontuacao - custo);
  PROGRESS.dicasUsadas++;
  usadas[qId] = nivel + 1;
  saveProgress(PROGRESS);
  const box = document.getElementById('hintQuestao');
  box.innerHTML = `💡 Dica ${nivel+1}/${dicas.length} ${custo>0?`(custo: -${custo} pontos)`:'(grátis)'}<br>` + escapeHtml(dicas[nivel]);
  box.classList.add('show');
}

/* ===================== TELA DE SUCESSO ===================== */
function viewSucesso(){
  const tempo = Math.floor((Date.now() - PROGRESS.inicio)/1000);

    <div class="card">
      <p>Parabéns, equipe <b>${escapeHtml(PROGRESS.equipe)}</b>! Todos os módulos foram concluídos.</p>
      <div class="grid2">
        <div><span class="badge">⏱ Tempo: ${m}:${s}</span></div>
        <div><span class="badge">★ Pontuação: ${PROGRESS.pontuacao}</span></div>
        <div><span class="badge">💡 Dicas usadas: ${PROGRESS.dicasUsadas}</span></div>
        <div><span class="badge">❌ Erros: ${PROGRESS.erros}</span></div>
      </div>
      <div class="row">

      </div>

  `;
}
function exportarPdf(){
  const tempo = Math.floor((Date.now() - PROGRESS.inicio)/1000);
  const m = String(Math.floor(tempo/60)).padStart(2,'0'), s = String(tempo%60).padStart(2,'0');
  document.getElementById('prTeam').textContent = PROGRESS.equipe;
  document.getElementById('prDate').textContent = new Date().toLocaleString('pt-BR');
  document.getElementById('prTime').textContent = `${m}:${s}`;
  document.getElementById('prHints').textContent = PROGRESS.dicasUsadas;
  document.getElementById('prErrors').textContent = PROGRESS.erros;
  document.getElementById('prScore').textContent = PROGRESS.pontuacao;
  window.print();
}
